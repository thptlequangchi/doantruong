:root{--bg:#f4f7fb;--panel:#fff;--text:#172033;--muted:#69758a;--line:#e3e9f2;--primary:#1b5cff;--primary2:#0f47d7;--nav:#0c1b35;--nav2:#10264b;--good:#0f9d6a;--warn:#e38b00;--danger:#dc3545;--violet:#7757e8;--shadow:0 10px 30px rgba(23,32,51,.08);--radius:16px}
[data-theme="dark"]{--bg:#0d1421;--panel:#151f30;--text:#edf3ff;--muted:#9babbe;--line:#28354a;--primary:#5b8cff;--primary2:#7ea3ff;--nav:#09111f;--nav2:#111e34;--shadow:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}.app-shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:22px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4d83ff,#5d4cff);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 24px rgba(65,103,255,.35)}.brand strong{display:block;font-size:18px}.brand span{display:block;color:#aebbd1;font-size:12px;margin-top:2px}nav{display:grid;gap:6px}.nav-item{border:0;background:transparent;color:#bdc8dc;padding:11px 12px;border-radius:10px;text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}.nav-item span{width:20px;text-align:center}.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.1);color:#fff}.sidebar-foot{margin-top:auto;padding:14px 8px;color:#93a3bd;font-size:12px;display:flex;align-items:center;gap:8px}.privacy-dot{width:8px;height:8px;border-radius:50%;background:#32d296;box-shadow:0 0 0 4px rgba(50,210,150,.13)}.main{min-width:0}.topbar{height:82px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:15}.title-wrap h1{font-size:22px;margin:0}.title-wrap p{font-size:12px;margin:3px 0 0;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.week-chip{background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:10px;color:var(--muted);font-size:13px}.week-chip select{border:0;background:t }

/* KPI cards */
.lqc-kpi{border-top:3px solid color-mix(in srgb,var(--kpi) 78%,#fff);background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--kpi) 3%,var(--panel)))}
.lqc-kpi .lqc-kpi-icon{box-shadow:inset 0 1px rgba(255,255,255,.65)}
.lqc-kpi .value{font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--lqc-navy) 88%,var(--text))}
/* Tables */
.table-wrap{border-top:0;overflow:auto;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--lqc-navy) 20%,transparent) transparent}
table{font-size:12.5px}
thead th{height:42px!important;padding:10px 13px!important;color:color-mix(in srgb,var(--lqc-navy) 68%,var(--muted))!important;background:linear-gradient(180deg,color-mix(in srgb,var(--lqc-navy) 5%,var(--panel)),color-mix(in srgb,var(--lqc-navy) 2%,var(--panel)))!important;border-bottom:1px solid color-mix(in srgb,var(--lqc-navy) 11%,var(--line))!important;box-shadow:0 1px 0 rgba(255,255,255,.55) inset}
tbody td{padding:11px 13px;border-bottom:1px solid color-mix(in srgb,var(--lqc-navy) 5%,var(--line));vertical-align:middle}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--lqc-navy) 1.3%,var(--panel))}
tbody tr:hover td{background:color-mix(in srgb,var(--lqc-green) 4%,var(--panel))!important}
tbody tr:last-child td{border-bottom:0}
td b{color:color-mix(in srgb,var(--lqc-navy) 90%,var(--text))}
.right{font-variant-numeric:tabular-nums}
/* Inputs */
.input,select.input,textarea.input,.score-input{border-color:color-mix(in srgb,var(--lqc-navy) 12%,var(--line));background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--bg) 20%,var(--panel)));box-shadow:0 1px 0 rgba(255,255,255,.6) inset;transition:border-color .15s,box-shadow .15s,background .15s}
.input:hover,select.input:hover,textarea.input:hover,.score-input:hover{border-color:color-mix(in srgb,var(--lqc-navy) 23%,var(--line))}
.input:focus,select.input:focus,textarea.input:focus,.score-input:focus{border-color:var(--lqc-green)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--lqc-green) 12%,transparent)!important;background:var(--panel)}
.field label{font-size:11px;letter-spacing:.2px;color:color-mix(in srgb,var(--lqc-navy) 62%,var(--muted))}
/* Buttons */
.btn{min-height:37px;border-radius:11px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;box-shadow:0 8px 20px rgba(11,43,79,.11)}
.btn:hover{transform:translateY(-1px);filter:none;box-shadow:0 10px 24px rgba(11,43,79,.14)}
.btn:active{transform:translateY(0)}
.btn.secondary{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--bg) 54%,var(--panel)));border-color:color-mix(in srgb,var(--lqc-navy) 11%,var(--line));color:color-mix(in srgb,var(--lqc-navy) 90%,var(--text))}
.btn.secondary:hover{border-color:color-mix(in srgb,var(--lqc-navy) 25%,var(--line));background:color-mix(in srgb,var(--lqc-navy) 3%,var(--panel))}
.btn.danger{background:linear-gradient(135deg,#c52d3b,#9e1e2a);box-shadow:0 8px 20px rgba(197,45,59,.15)}
.btn.small{min-height:31px;padding:6px 10px}
.icon-btn{display:grid;place-items:center;transition:.14s;box-shadow:var(--ui-shadow-xs)}.icon-btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--lqc-navy) 22%,var(--line));background:color-mix(in srgb,var(--lqc-navy) 3%,var(--panel))}
/* Pills / badges */
.pill,.status-badge,.scope-chip,.lqc-grade-pill{font-weight:800;letter-spacing:.08px;box-shadow:inset 0 1px rgba(255,255,255,.55)}
.pill{padding:5px 9px;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--bg) 60%,var(--panel)))}
.pill.danger{box-shadow:none}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);font-size:10px}.status-badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
/* Alerts */
.alert{border-radius:13px;padding:12px 14px;line-height:1.55;box-shadow:inset 0 1px rgba(255,255,255,.5)}
.alert:before{content:"ℹ";display:inline-grid;place-items:center;width:20px;height:20px;margin-right:7px;border-radius:50%;background:color-mix(in srgb,var(--warn) 14%,var(--panel));font-weight:900}
/* Tabs */
.tabs{gap:5px;padding:0 16px;background:color-mix(in srgb,var(--bg) 42%,var(--panel))}.tab{margin-top:6px;border-radius:9px 9px 0 0;padding:10px 12px}.tab:hover{background:color-mix(in srgb,var(--lqc-navy) 3%,var(--panel))}.tab.active{color:var(--lqc-navy);background:var(--panel);border-bottom-color:var(--primary)}
/* Student cards */
.student-card{border-radius:16px;background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--lqc-green) 2%,var(--panel)));border:1px solid color-mix(in srgb,var(--lqc-navy) 7%,var(--line));box-shadow:var(--ui-shadow-xs)}
.student-card h4{color:var(--lqc-navy)}
.student-names{scrollbar-width:thin}
/* Modal */
.modal-backdrop{background:rgba(5,20,37,.56);backdrop-filter:blur(7px)}
.modal{border:1px solid color-mix(in srgb,var(--lqc-navy) 10%,var(--line))!important;box-shadow:0 36px 100px rgba(3,21,39,.28)!important;overflow:hidden}
.modal-head{padding:17px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--lqc-navy) 5%,var(--panel)),color-mix(in srgb,var(--lqc-gold) 5%,var(--panel)));border-bottom-color:color-mix(in srgb,var(--lqc-navy) 8%,var(--line))}.modal-head h3{font-size:17px;color:var(--lqc-navy);letter-spacing:-.25px}.modal-body{padding:20px}.modal-foot{padding:13px 20px;background:color-mix(in srgb,var(--bg) 48%,var(--panel));border-top-color:color-mix(in srgb,var(--lqc-navy) 7%,var(--line))}
/* Rank & bars */
.rank{box-shadow:0 4px 12px rgba(8,31,58,.08)}
.bar-track{height:10px;border:1px solid color-mix(in srgb,var(--lqc-navy) 5%,var(--line));background:color-mix(in srgb,var(--lqc-navy) 3%,var(--bg))}.bar-fill{box-shadow:0 2px 8px rgba(11,43,79,.12)}
/* Empty states */
.empty{padding:42px 22px;color:var(--muted);background:radial-gradient(circle at 50% 10%,color-mix(in srgb,var(--lqc-navy) 3%,transparent),transparent 45%)}
/* Accessibility / focus */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--lqc-green) 22%,transparent);outline-offset:2px}
@media(max-width:760px){.toolbar{padding:10px}.card-head{padding:13px 14px}.card-pad{padding:15px}thead th,tbody td{padding-left:10px!important;padding-right:10px!important}.btn{min-height:39px}.modal-body{padding:16px}.modal-head,.modal-foot{padding-left:16px;padding-right:16px}}

/* v1.64 · Executive Dashboard */

.duty-board{margin:14px 0 18px;display:grid;gap:12px}.duty-board-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.duty-board-head>div:first-child{min-width:240px}.duty-board-head small{display:block;color:var(--muted);font-weight:800;letter-spacing:.08em;font-size:10px}.duty-board-head h3{margin:2px 0 0;font-size:19px}.duty-date-chip{padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:850;font-size:12px}.duty-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.duty-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.duty-kpi{border:1px solid var(--line);border-radius:14px;padding:12px 13px;background:var(--panel);min-height:96px;position:relative;overflow:hidden}.duty-kpi:after{content:'';position:absolute;inset:auto -22px -26px auto;width:78px;height:78px;border-radius:50%;background:color-mix(in srgb,var(--duty-accent,var(--primary)) 10%,transparent)}.duty-kpi span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}.duty-kpi strong{display:block;font-size:28px;line-height:1.1;margin:5px 0 3px;color:var(--text)}.duty-kpi small{color:var(--muted);font-size:10px}.duty-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.duty-panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:11px 12px;min-width:0}.duty-panel-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}.duty-panel-title b{font-size:12px}.duty-panel-title span{margin-left:auto;color:var(--muted);font-size:9px}.duty-list{display:grid;gap:6px}.duty-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;background:color-mix(in srgb,var(--panel) 92%,var(--primary) 8%);border:1px solid color-mix(in srgb,var(--line) 75%,transparent)}.duty-row>div{min-width:0}.duty-row b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duty-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duty-row strong{font-size:12px}.duty-row.danger{background:color-mix(in srgb,#b4232d 7%,var(--panel));border-color:color-mix(in srgb,#b4232d 22%,var(--line))}.duty-empty{padding:12px 8px;color:var(--muted);font-size:10px;text-align:center;border:1px dashed var(--line);border-radius:9px}.duty-recent{grid-column:1/-1}.duty-recent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.duty-recent-item{border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:var(--panel)}.duty-recent-item b{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duty-recent-item small{display:block;color:var(--muted);font-size:9px;margin-top:3px;line-height:1.35}.duty-recent-time{font-weight:850;color:var(--primary)!important}.duty-alert{display:inline-flex;padding:2px 6px;border-radius:999px;background:color-mix(in srgb,#b4232d 10%,var(--panel));color:#b4232d;font-size:8px;font-weight:900;margin-top:4px}
@media(max-width:1100px){.duty-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.duty-grid{grid-template-columns:1fr 1fr}.duty-recent{grid-column:1/-1}.duty-recent-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.duty-kpis,.duty-grid,.duty-recent-grid{grid-template-columns:1fr}.duty-recent{grid-column:auto}.duty-actions{width:100%;margin-left:0}.duty-actions .btn{flex:1}.duty-board-head h3{font-size:17px}}
/* v2.0.26 · Báo cáo trực ban theo ngày */
.duty-report-toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:12px}.duty-report-toolbar .field{min-width:180px}.duty-report-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.duty-report-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 14px}.duty-report-stat{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:var(--panel)}.duty-report-stat span{display:block;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase}.duty-report-stat strong{display:block;font-size:21px;margin-top:3px}.duty-report-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.duty-report-box{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel);min-width:0}.duty-report-box h4{margin:0 0 8px;font-size:12px}.duty-report-mini{display:grid;gap:5px}.duty-report-mini-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 7px;border-radius:8px;background:color-mix(in srgb,var(--panel) 92%,var(--primary) 8%);font-size:10px}.duty-report-mini-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.duty-report-table-wrap{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:12px}.duty-report-table{width:100%;border-collapse:collapse;font-size:10px}.duty-report-table th,.duty-report-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.duty-report-table th{position:sticky;top:0;background:var(--panel);z-index:1;text-align:left;font-size:9px;text-transform:uppercase;color:var(--muted)}.duty-report-table tr:last-child td{border-bottom:0}.duty-report-pending{display:inline-flex;margin-top:3px;padding:2px 5px;border-radius:999px;background:color-mix(in srgb,#cf6b19 10%,var(--panel));color:#a45110;font-size:8px;font-weight:900}.duty-report-privacy{padding:9px 10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px;margin:8px 0}.duty-report-repeat{color:#b4232d;font-weight:850}

@media(max-width:600px){.duty-report-summary{grid-template-columns:1fr 1fr}.duty-report-actions{width:100%;margin-left:0}.duty-report-actions .btn{flex:1}.duty-report-table-wrap{max-height:52vh}}

function studentConductSummary(cls,student,sem='hk1'){
 if(sem==='year'){
  const h1=studentConductSummary(cls,student,'hk1'),h2=studentConductSummary(cls,student,'hk2');
  const conductOrder={'Tốt':0,'Khá':1,'Trung bình':2,'Yếu':3},statusOrder={'Bình thường':0,'Theo dõi':1,'Cảnh báo':2,'Nghiêm trọng':3};
  const suggested=conductOrder[h1.suggested]>=conductOrder[h2.suggested]?h1.suggested:h2.suggested;
  const status=statusOrder[h1.status]>=statusOrder[h2.status]?h1.status:h2.status;
  const statusClass=status==='Nghiêm trọng'?'severe':status==='Cảnh báo'?'alert':status==='Theo dõi'?'watch':'normal';
  const records=[...h1.records,...h2.records],repeated={};records.forEach(v=>{const k=v.ruleCode||v.content;repeated[k]=(repeated[k]||0)+occurrences(v)});
  const reasons=[];if(h1.count)reasons.push(`HKI: ${h1.count} lỗi · gợi ý ${h1.suggested}.`);if(h2.count)reasons.push(`HKII: ${h2.count} lỗi · gợi ý ${h2.suggested}.`);if(suggested==='Yếu')reasons.push('Mức năm lấy theo học kỳ có cảnh báo cao hơn, không cộng dồn số lỗi hai học kỳ để suy ra hạnh kiểm.');
  return {cls,student,sem,records,count:h1.count+h2.count,points:h1.points+h2.points,phoneCount:h1.phoneCount+h2.phoneCount,directWeak:[...h1.directWeak,...h2.directWeak],downgradeSteps:h1.downgradeSteps+h2.downgradeSteps,suggested,status,statusClass,reasons,topRepeat:Object.entries(repeated).sort((a,b)=>b[1]-a[1])[0]};
 }
 const sid=studentIdFor(cls,student);const records=state.violations.filter(v=>studentMatchesViolation(v,cls,student,sid)&&inSemester(v,sem));
 const count=records.reduce((sum,v)=>sum+occurrences(v),0);
 const points=records.reduce((sum,v)=>sum+num(v.totalPoints),0);
 let suggested=count<=1?'Tốt':count<=4?'Khá':count<=6?'Trung bình':'Yếu';
 const phoneCount=records.filter(v=>String(v.ruleCode||'')==='32'||normalizeText(v.content).includes('dien thoai thong minh')).reduce((sum,v)=>sum+occurrences(v),0);
 const directWeak=records.filter(v=>{
   const code=String(v.ruleCode||''); const d=normalizeText(v.discipline||''); const c=normalizeText(v.content||'');
   return d.includes('hanh kiem yeu')||['30','34','37','44'].includes(code)||code==='36'||c.includes('gian lan trong kiem tra')||c.includes('gian lan trong thi cu');
 });
 const downgradeRecords=records.filter(v=>normalizeText(v.discipline||'').includes('ha 1 bac hanh kiem'));
 const downgradeSteps=downgradeRecords.reduce((sum,v)=>sum+occurrences(v),0);
 const reasons=[];
 if(count>=2&&count<=4) reasons.push(`${count} lỗi: mốc gợi ý Khá theo quy chế.`);
 if(count>=5&&count<=6) reasons.push(`${count} lỗi: mốc gợi ý Trung bình theo quy chế.`);
 if(count>6) reasons.push(`${count} lỗi: vượt 6 lỗi trong học kỳ.`);
 if(phoneCount>=2) reasons.push(`Sử dụng điện thoại ${phoneCount} lần trong học kỳ: tái phạm từ lần 2.`);
 if(directWeak.length) reasons.push(`Có ${directWeak.length} bản ghi thuộc nhóm có cảnh báo hạnh kiểm Yếu/nghiêm trọng.`);
 if(downgradeSteps) reasons.push(`Có ${downgradeSteps} lượt thuộc nhóm “hạ 1 bậc hạnh kiểm”.`);
 if(phoneCount>=2||directWeak.length||count>6) suggested='Yếu';
 else if(downgradeSteps) suggested=lowerConduct(suggested,downgradeSteps);
 let status='Bình thường',statusClass='normal';
 if(records.length){status='Theo dõi';statusClass='watch'}
 if(count>=2||downgradeSteps||phoneCount) {status='Cảnh báo';statusClass='alert'}
 if(suggested==='Yếu'||directWeak.length||phoneCount>=2||count>6){status='Nghiêm trọng';statusClass='severe'}
 const repeated={};records.forEach(v=>{const k=v.ruleCode||v.content;repeated[k]=(repeated[k]||0)+occurrences(v)});
 const topRepeat=Object.entries(repeated).sort((a,b)=>b[1]-a[1])[0];

}

function normalizeText(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase()}

 return {allCount:all.length,allPoints:all.reduce((s,v)=>s+num(v.totalPoints),0),weekCount:inWeek.length,weekPoints:inWeek.reduce((s,v)=>s+num(v.totalPoints),0)};
}
function semesterFromWeek(w){return num(w)<=18?'hk1':'hk2'}
function conductFromCount(count){return count<=1?'Tốt':count<=4?'Khá':count<=6?'Trung bình':'Yếu'}
function conductLevel(name){return ({'Tốt':0,'Khá':1,'Trung bình':2,'Yếu':3})[name]??0}
function isPhoneRule(rule){return String(rule?.code||'')==='32'||normalizeText(rule?.name||rule?.content||'').includes('dien thoai thong minh')}
function isDowngradeRule(rule){return normalizeText(rule?.discipline||'').includes('ha 1 bac hanh kiem')}
function isDirectWeakRule(rule){
 const code=String(rule?.code||''),d=normalizeText(rule?.discipline||''),c=normalizeText(rule?.name||rule?.content||'');
 return d.includes('hanh kiem yeu')||['30','34','37','44','36'].includes(code)||c.includes('gian lan trong kiem tra')||c.includes('gian lan trong thi cu');
}
function quickRiskAnalysis(data){
 const sem=semesterFromWeek(data.week),studentRules=(data.rules||[]).filter(r=>r.scope!=='class'),qty=Math.max(1,num(data.quantity)||1);
 const items=(data.students||[]).map(student=>{
  const current=studentConductSummary(data.className,student,sem);
  const addedCount=studentRules.reduce((sum)=>sum+qty,0),projectedCount=current.count+addedCount;
  const addPhone=studentRules.filter(isPhoneRule).reduce(sum=>sum+qty,0),projectedPhone=current.phoneCount+addPhone;
  const addDowngrade=studentRules.filter(isDowngradeRule).reduce(sum=>sum+qty,0),projectedDowngrade=current.downgradeSteps+addDowngrade;
  const selectedWeak=studentRules.filter(isDirectWeakRule);
  let projectedSuggested=conductFromCount(projectedCount);
  if(projectedPhone>=2||current.directWeak.length||selectedWeak.length||projectedCount>6)projectedSuggested='Yếu';
  else if(projectedDowngrade)projectedSuggested=lowerConduct(projectedSuggested,projectedDowngrade);
  const repeats=studentRules.map(rule=>{const before=current.records.filter(v=>(String(v.ruleCode||'')&&String(v.ruleCode||'')===String(rule.code||''))||(!v.ruleCode&&v.content===rule.name)).reduce((sum,v)=>sum+occurrences(v),0);return {rule,before,after:before+qty}}).filter(x=>x.after>1);
  const phoneCross=current.phoneCount<2&&projectedPhone>=2;
  const thresholdCross=[];
  if(current.count<2&&projectedCount>=2)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: chạm mốc gợi ý Khá.`);
  if(current.count<5&&projectedCount>=5)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: chạm mốc gợi ý Trung bình.`);
  if(current.count<=6&&projectedCount>6)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: vượt 6 lỗi trong ${semesterLabel(sem)}.`);
  if(phoneCross)thresholdCross.push(`Điện thoại từ ${current.phoneCount} lên ${projectedPhone} lần: đây là lần thứ ${projectedPhone}, kích hoạt cảnh báo hạnh kiểm Yếu.`);
  selectedWeak.forEach(r=>thresholdCross.push(`${r.code?`TT ${r.code} · `:''}${r.name}: thuộc nhóm cảnh báo hạnh kiểm Yếu/nghiêm trọng.`));
  const escalates=conductLevel(projectedSuggested)>conductLevel(current.suggested);
  let level='normal';
  if(repeats.length)level='watch';
  if(escalates||thresholdCross.length)level='alert';
  if(projectedSuggested==='Yếu'&&(escalates||phoneCross||selectedWeak.length)||phoneCross||selectedWeak.length)level='severe';
  return {student,sem,current,projectedCount,projectedPhone,projectedDowngrade,projectedSuggested,repeats,thresholdCross,phoneCross,selectedWeak,escalates,level,addedCount};
 });
 const severe=items.filter(x=>x.level==='severe').length,escalations=items.filter(x=>x.escalates).length,repeated=items.filter(x=>x.repeats.length).length;
 return {sem,items,severe,escalations,repeated,studentRules};
}
function quickRiskHtml(data){

 const sorted=[...risk.items].sort((a,b)=>(({severe:3,alert:2,watch:1,normal:0}[b.level]-{severe:3,alert:2,watch:1,normal:0}[a.level])||b.projectedCount-a.projectedCount));
 const shown=sorted.slice(0,8);
 const cards=shown.map(x=>{

  const repeats=x.repeats.length?`<div class="risk-rule-repeat">${x.repeats.slice(0,3).map(r=>`<span>↻ ${r.rule.code?`TT ${esc(r.rule.code)} · `:''}${esc(r.rule.name)}: ${r.before} → <b>${r.after}</b> lần</span>`).join('')}${x.repeats.length>3?`<span>… và ${x.repeats.length-3} lỗi lặp khác</span>`:''}</div>`:'';
  return `<div class="risk-card risk-${x.level}"><div class="risk-card-head"><b>${esc(x.student)}</b><span class="spacer"></span><span class="future-pill ${x.level==='normal'?'ok':x.level}">${levelLabel}</span>${x.escalates?'<span class="pre-save-badge">Tăng mức</span>':''}</div><div class="risk-transition"><span>${esc(semText)}: ${x.current.count} lỗi</span><span class="risk-arrow">→</span><b>${x.projectedCount} lỗi</b><span>·</span><span class="conduct-pill ${conductClass(x.current.suggested)}">${esc(x.current.suggested)}</span><span class="risk-arrow">→</span><span class="conduct-pill ${conductClass(x.projectedSuggested)}">${esc(x.projectedSuggested)}</span></div><div class="risk-reasons">${reasons.join('')}</div>${repeats}</div>`;
 }).join('');
 return `<div class="recidivism-panel"><div class="recidivism-head"><b>🛡 Cảnh báo tái phạm · ${esc(semText)}</b><span class="spacer"></span><span class="future-pill ${risk.severe?'severe':risk.escalations?'alert':risk.repeated?'watch':'ok'}">${risk.severe?`${risk.severe} nghiêm trọng`:risk.escalations?`${risk.escalations} tăng mức`:risk.repeated?`${risk.repeated} có lặp lại`:'Chưa tăng mức'}</span></div><div class="recidivism-summary"><div><span>Đang chọn</span><strong>${data.students.length} HS</strong></div><div><span>Tăng mức dự kiến</span><strong>${risk.escalations}</strong></div><div><span>Cảnh báo nghiêm trọng</span><strong class="${risk.severe?'danger-text':''}">${risk.severe}</strong></div></div><div class="risk-list">${cards}${sorted.length>shown.length?`<div class="risk-empty">Còn ${sorted.length-shown.length} học sinh khác. Web vẫn kiểm tra đầy đủ khi lưu.</div>`:''}</div></div>`;
}

th><th class="right">Điểm trừ</th><th>Gợi ý HK</th><th>Mức theo dõi</th><th>Lỗi lặp nhiều</th><th>Ghi chú cảnh báo</th><th></th></tr></thead><tbody id="wBody"></tbody></table></div></div>`;

function reportCategoryKey(v){
 const code=String(v?.ruleCode||'');const t=normalizeText(v?.content||'');
 if(['5','6','47'].includes(code)||t.includes('vang hoc')||t.includes('vang hoat dong')) return 'Vắng học/HĐ';
 if(['8','9'].includes(code)||t.includes('cham hoc')||t.includes('cham tiet')||t.includes('di muon')) return 'Chậm học/tiết';
 if(code==='32'||t.includes('dien thoai')) return 'Điện thoại';
 if(['14','15','16'].includes(code)||t.includes('dong phuc')||t.includes('phu hieu')||t.includes('nhuom toc')||t.includes('khuyen tai')) return 'Trang phục';
 if(code==='30'||t.includes('danh nhau')||t.includes('gay go')) return 'Đánh nhau';
 return 'Khác';
}
function classReportData(cls,sem='hk1'){
 const roster=window.SEED_ROSTER[cls]||[];
 const summaries=roster.map(student=>studentConductSummary(cls,student,sem));
 const studentRecords=state.violations.filter(v=>studentViolationOnly(v)&&v.className===cls&&inSemester(v,sem));
 const classRecords=state.violations.filter(v=>v.scope==='class'&&v.className===cls&&inSemester(v,sem));
 const violators=summaries.filter(x=>x.count>0),severe=summaries.filter(x=>x.status==='Nghiêm trọng'),alerts=summaries.filter(x=>x.status==='Cảnh báo');
 const attention=summaries.filter(x=>x.count>0).sort((a,b)=>{const p={'Nghiêm trọng':0,'Cảnh báo':1,'Theo dõi':2,'Bình thường':3};return p[a.status]-p[b.status]||b.count-a.count||b.points-a.points||a.student.localeCompare(b.student,'vi')});
 const issueNames=['Vắng học/HĐ','Chậm học/tiết','Điện thoại','Trang phục','Đánh nhau'];
 const issues=issueNames.map(name=>{const rs=studentRecords.filter(v=>reportCategoryKey(v)===name);return {name,count:rs.reduce((n,v)=>n+occurrences(v),0),students:new Set(rs.map(v=>v.student)).size};});
 const byRule={};studentRecords.forEach(v=>{const key=(v.ruleCode?`TT ${v.ruleCode} · `:'')+(v.content||'Vi phạm');byRule[key]=(byRule[key]||0)+occurrences(v)});
 const topRules=Object.entries(byRule).sort((a,b)=>b[1]-a[1]).slice(0,7);
 const recent=[...studentRecords,...classRecords].sort((a,b)=>num(b.week)-num(a.week)||String(b.updatedAt||b.createdAt||'').localeCompare(String(a.updatedAt||a.createdAt||''))).slice(0,10);
 return {cls,sem,roster,summaries,studentRecords,classRecords,violators,severe,alerts,attention,issues,topRules,recent};
}

function reconcileRosterRows(rows){

function normalizeImportHeader(v){return normalizeText(String(v||'')).replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}

function buildStudentImportAnalysis(rows){
 const profiles=allStudentProfiles(),byCode={};profiles.forEach(p=>{const code=normalizeText(p.studentCode||'');if(code)(byCode[code]||(byCode[code]=[])).push(p)});
 const seenIdentity=new Set(),seenCode=new Set();

  if(!r.name||!validImportClass(r.className)){status='invalid';detail=!r.name?'Thiếu họ tên':'Lớp không hợp lệ'}else{
   const codeKey=normalizeText(r.studentCode||''),birthKey=normalizeBirthIdentity(r.birthDate||''),nameKey=normalizeText(r.name),classKey=normalizeText(r.className),rowKey=codeKey?`code:${codeKey}`:`person:${classKey}|${nameKey}|${birthKey||'__NO_BIRTH__'}`;

     else if(sameClassName.length===1)profile=sameClassName[0];else if(sameClassName.length>1){status='ambiguous';detail=`Có ${sameClassName.length} hồ sơ cùng tên trong lớp; cần Ngày sinh hoặc Mã HS để phân biệt`;}

   }
  }
  return {...r,row:i+1,status,profile,detail}
 })
}

 state.innovationConfig=Object.assign(innovationDefaultConfig(),state.innovationConfig||{});

 state.innovationConfig.baseline=Object.assign(innovationDefaultConfig().baseline,state.innovationConfig.baseline||{});

function auditProofPage(){
 ensureInnovationState();title('Kiểm chứng & nhật ký','Kiểm tra tính liên tục của dấu vết thao tác');const logs=(state.auditLog||[]).slice().sort((a,b)=>String(a.at||'').localeCompare(String(b.at||''))),chain=[];let prev='ROOT';for(const l of logs){const raw=[prev,l.id,l.at,l.action,l.entity,l.detail,l.actorUid||l.actor||''].join('|');prev=innoHash(raw);chain.push({...l,digest:prev})}const related=chain.filter(x=>/innovation|case_|violation_/i.test(x.action||''));

function innoHash(s){let h1=0x811c9dc5,h2=0x9e3779b9;for(let i=0;i<s.length;i++){h1=Math.imul(h1^s.charCodeAt(i),16777619);h2=Math.imul(h2+s.charCodeAt(i),2654435761)}return `${(h1>>>0).toString(16).padStart(8,'0')}${(h2>>>0).toString(16).padStart(8,'0')}`}

function innovationApplyBranding(){if(INNOVATION_LEVEL<10)return;ensureInnovationState();const s=state.innovationConfig.school;document.title=`Nề nếp ${s.name||'THPT'}`;document.querySelectorAll('[data-school-logo],.lqc-hero-school-logo img').forEach(img=>{if(s.logoUrl)img.src=s.logoUrl});const copy=document.querySelector('.lqc-hero-school-copy');if(copy){const sm=copy.querySelector('small'),b=copy.querySelector('b');if(sm)sm.textContent=s.department||'';if(b)b.textContent=s.name||''}const ov=document.querySelector('.lqc-hero-overline');if(ov)ov.textContent=`${String(s.fullName||s.name||'TRƯỜNG').toUpperCase()} · NĂM HỌC ${currentSchoolYear().label}`;const motto=document.querySelector('.lqc-hero-motto b');if(motto)motto.textContent=s.motto||''}

function surveyPage(){
 ensureInnovationState();title('Khảo sát người sử dụng','Thu thập phản hồi làm minh chứng hiệu quả và khả năng nhân rộng');const round=state.activeSchoolYear,surveys=(state.auditLog||[]).filter(x=>x.action==='innovation_survey'&&(!x.meta?.surveyRound||x.meta.surveyRound===round)),avg=k=>surveys.length?surveys.reduce((s,x)=>s+num(x.meta?.[k]),0)/surveys.length:0,uidKey=cloudRuntime?.user?.uid||currentUser().id||'local',mine=surveys.find(x=>(x.actorUid||x.actor)===uidKey),opt='<option value="">Chưa chọn</option>'+[1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('');
 $('#content').innerHTML=`${innoHeader('PHẢN HỒI NGƯỜI DÙNG','Khảo sát triển khai','Mỗi tài khoản gửi một phiếu chính thức trong mỗi năm học. Các thang điểm không chọn sẵn để tránh thiên lệch phản hồi.')}
 <div class="inno-grid"><div class="inno-metric"><span>Số phiếu</span><strong>${surveys.length}</strong></div><div class="inno-metric"><span>Dễ sử dụng</span><strong>${fmt(avg('ease'))}/5</strong></div><div class="inno-metric"><span>Hữu ích</span><strong>${fmt(avg('useful'))}/5</strong></div><div class="inno-metric"><span>Hỗ trợ phối hợp</span><strong>${fmt(avg('coordination'))}/5</strong></div></div>
 ${mine?`<div class="inno-callout"><b>Thầy/cô đã gửi phiếu chính thức cho năm học này.</b> Phiếu được giữ nguyên trong nhật ký để bảo đảm tính khách quan của minh chứng.</div>`:`<div class="inno-section"><h3>Gửi phiếu đánh giá</h3><div class="inno-form-grid cols-3"><div class="field"><label>Dễ sử dụng (1–5)</label><select id="svEase" class="input">${opt}</select></div><div class="field"><label>Mức hữu ích (1–5)</label><select id="svUseful" class="input">${opt}</select></div><div class="field"><label>Hỗ trợ phối hợp (1–5)</label><select id="svCoord" class="input">${opt}</select></div><div class="field"><label>Sẵn sàng giới thiệu/nhân rộng (1–5)</label><select id="svRecommend" class="input">${opt}</select></div><div class="field full"><label>Nhận xét</label><textarea id="svComment" class="input" placeholder="Điểm thuận lợi, khó khăn hoặc đề xuất cải tiến..."></textarea></div></div><button class="btn" id="submitSurvey">Gửi phiếu chính thức</button></div>`}
 <div class="inno-section"><h3>Tổng hợp phản hồi</h3>${innoBarsHtml([{label:'Dễ sử dụng',value:avg('ease')},{label:'Hữu ích',value:avg('useful')},{label:'Phối hợp',value:avg('coordination')},{label:'Nhân rộng',value:avg('recommend')}])}</div>`;
 if($('#submitSurvey'))$('#submitSurvey').onclick=()=>{const vals=['#svEase','#svUseful','#svCoord','#svRecommend'].map(id=>num($(id).value));if(vals.some(v=>v<1||v>5))return toast('Hãy chọn đầy đủ 4 tiêu chí trước khi gửi');if(!confirm('Gửi phiếu chính thức? Sau khi gửi, tài khoản này không thể gửi lại trong cùng năm học.'))return;logAudit('innovation_survey','innovation','Phiếu đánh giá người sử dụng',{ease:vals[0],useful:vals[1],coordination:vals[2],recommend:vals[3],comment:$('#svComment').value.trim(),role:currentUser().role,surveyRound:round});save();toast('Đã ghi nhận phiếu chính thức');surveyPage()}
}

function innovationReadiness(){
 ensureInnovationState();const m=innoMetrics(),cfg=state.innovationConfig,study=innovationStudy(),round=state.activeSchoolYear,surveys=(state.auditLog||[]).filter(x=>x.action==='innovation_survey'&&(!x.meta?.surveyRound||x.meta.surveyRound===round)),surveyRoles=new Set(surveys.map(x=>x.meta?.role).filter(Boolean)),snapshotWeeks=new Set(study.snapshots.map(x=>num(x.week)).filter(Boolean)),bghReviews=(state.auditLog||[]).filter(x=>x.action==='innovation_bgh_review'&&(!x.meta?.schoolYear||x.meta.schoolYear===round)),closedNeeded=Math.max(3,Math.ceil(m.violations*.5));
 const checks=[
  ['Baseline đã xác nhận & khóa',!!cfg.baseline.lockedAt&&String(cfg.baseline.note||'').trim().length>=10,15],
  ['Chuỗi minh chứng đủ thời gian',study.snapshots.length>=6&&snapshotWeeks.size>=4,15],
  ['Quy trình xử lý có dữ liệu hoàn tất',m.violations>=5&&m.closed>=closedNeeded,15],
  ['Cảnh báo sớm đã cấu hình',INNOVATION_LEVEL>=4&&num(cfg.risk.yellow)>0&&num(cfg.risk.orange)>num(cfg.risk.yellow)&&num(cfg.risk.red)>num(cfg.risk.orange),10],
  ['Có đánh giá của BGH',bghReviews.length>=1,10],
  ['Chính sách dữ liệu & ẩn danh',!!cfg.privacy&&cfg.privacy.anonymizeExports===true,10],
  ['Cấu hình nhân rộng hoàn chỉnh',!!cfg.school?.name&&!!cfg.deployment?.unitCode,10],
  ['Khảo sát đủ cỡ mẫu và đa vai trò',surveys.length>=10&&surveyRoles.size>=3,15]
 ];return {checks,score:checks.reduce((s,x)=>s+(x[1]?x[2]:0),0),surveys:surveys.length,surveyRoles:surveyRoles.size,bghReviews:bghReviews.length,snapshotWeeks:snapshotWeeks.size,closedNeeded}
}
function innovationHubPage(){
 ensureInnovationState();title('Innovation Edition','Sẵn sàng hoàn thiện hồ sơ sáng kiến cấp ngành');const r=innovationReadiness(),m=innoMetrics(),risk=innoRiskRows(),canReview=['superadmin','admin','bgh'].includes(currentUser().role);
 $('#content').innerHTML=`${innoHeader('INNOVATION EDITION','Trung tâm sáng kiến cấp ngành','Điểm sẵn sàng chỉ tăng khi có minh chứng đủ thời gian, baseline đã khóa, cỡ mẫu phản hồi phù hợp và đánh giá của BGH.',r.score)}
 <div class="inno-grid"><div class="inno-metric"><span>Mốc minh chứng</span><strong>${innovationStudy().snapshots.length}</strong><small>${r.snapshotWeeks} tuần khác nhau · mục tiêu ≥ 6 mốc/4 tuần</small></div><div class="inno-metric"><span>Vụ việc hoàn tất</span><strong>${m.closed}</strong><small>Cần ≥ ${r.closedNeeded} trên ${m.violations} vụ hiện có</small></div><div class="inno-metric"><span>Phiếu phản hồi</span><strong>${r.surveys}</strong><small>${r.surveyRoles} nhóm vai trò · mục tiêu ≥10 phiếu/3 vai trò</small></div><div class="inno-metric"><span>Đánh giá BGH</span><strong>${r.bghReviews}</strong><small>Cần ít nhất 1 đợt xác nhận</small></div></div>
 <div class="inno-section"><div class="inno-section-head"><h3>Checklist hồ sơ sáng kiến</h3><span class="spacer"></span><div class="inno-actions"><button class="btn secondary" data-go-inno="evidence">Minh chứng</button><button class="btn secondary" data-go-inno="compareimpact">Trước–sau</button>${canReview?'<button class="btn secondary" id="recordBghReview">Ghi đánh giá BGH</button>':''}<button class="btn" data-go-inno="innovationreports">Xuất báo cáo</button></div></div><div class="inno-checklist">${r.checks.map(([name,ok,pts])=>`<div class="inno-check"><div class="mark">${ok?'✅':'⬜'}</div><div><b>${esc(name)}</b><small>${ok?'Đã đạt':'Cần bổ sung'} · ${pts} điểm</small></div></div>`).join('')}</div></div>
 <div class="inno-section"><h3>Nguyên tắc sử dụng kết quả</h3><div class="inno-callout warn">Điểm sẵn sàng là checklist nội bộ, không phải điểm chấm của Hội đồng. Hệ thống hỗ trợ tổng hợp và phát hiện tín hiệu; mọi kết luận giáo dục và đánh giá hiệu quả phải dựa trên hồ sơ, bối cảnh và người có thẩm quyền.</div></div>`;
 $$('[data-go-inno]').forEach(b=>b.onclick=()=>{page=b.dataset.goInno;render()});if($('#recordBghReview'))$('#recordBghReview').onclick=()=>{const note=prompt('Nhận xét/đánh giá của BGH về đợt triển khai:','');if(!note||note.trim().length<10)return toast('Nhận xét cần đủ rõ');logAudit('innovation_bgh_review','innovation','Đánh giá BGH về triển khai',{schoolYear:state.activeSchoolYear,note:note.trim(),role:currentUser().role});save();toast('Đã ghi nhận đánh giá BGH');innovationHubPage()}
}

function innovationInstallNav(){
 // Nhóm Sáng kiến chỉ dành cho Superadmin/Admin; các vai trò khác bị ẩn bởi ROLE_PAGE_PROFILE.
 const nav=$('#nav');if(!nav||$('#innovationNavGroup'))return;const group=document.createElement('div');group.className='nav-group';group.id='innovationNavGroup';group.dataset.navGroup='innovation';const items=[];
 if(INNOVATION_LEVEL>=12)items.push(['innovationhub','◆','Innovation']);if(INNOVATION_LEVEL>=1)items.push(['evidence','◉','Minh chứng']);if(INNOVATION_LEVEL>=2)items.push(['workflow','↻','Quy trình xử lý']);if(INNOVATION_LEVEL>=4)items.push(['riskcenter','⚠','Cảnh báo sớm']);if(INNOVATION_LEVEL>=5)items.push(['execbgh','▥','Dashboard BGH']);if(INNOVATION_LEVEL>=6)items.push(['compareimpact','⇄','Trước – sau']);if(INNOVATION_LEVEL>=7)items.push(['innovationreports','▤','Báo cáo sáng kiến']);if(INNOVATION_LEVEL>=8)items.push(['auditproof','⌁','Kiểm chứng']);if(INNOVATION_LEVEL>=9)items.push(['privacycenter','◈','Bảo vệ dữ liệu']);if(INNOVATION_LEVEL>=10)items.push(['deployment','⌂','Nhân rộng']);if(INNOVATION_LEVEL>=11)items.push(['survey','☆','Khảo sát']);
 group.innerHTML=`<div class="nav-group-label">Sáng kiến</div>${items.map(([pg,ico,label])=>`<button class="nav-item" data-page="${pg}"><span>${ico}</span>${label}</button>`).join('')}`;const system=nav.querySelector('[data-nav-group="system"]');nav.insertBefore(group,system||null)
}
function installInnovationUpgrade(){
 ensureInnovationState();
 const pagePerm={evidence:'reports',workflow:'reports',riskcenter:'reports',execbgh:'reports',compareimpact:'reports',innovationreports:'reports',auditproof:'audit',privacycenter:'settings',deployment:'settings',survey:'reports',innovationhub:'reports'};Object.assign(PAGE_PERMISSION,pagePerm);
 const profile={superadmin:['evidence','workflow','riskcenter','execbgh','compareimpact','innovationreports','auditproof','privacycenter','deployment','survey','innovationhub'],admin:['evidence','workflow','riskcenter','execbgh','compareimpact','innovationreports','auditproof','privacycenter','deployment','survey','innovationhub'],doantruong:[],giamthi:[],gvcn:[],teacher:[],bgh:[],viewer:[]};
 Object.entries(profile).forEach(([role,pages])=>{ROLE_PAGE_PROFILE[role]=ROLE_PAGE_PROFILE[role]||[];pages.forEach(pg=>{const min={evidence:1,workflow:2,riskcenter:4,execbgh:5,compareimpact:6,innovationreports:7,auditproof:8,privacycenter:9,deployment:10,survey:11,innovationhub:12}[pg]||99;if(INNOVATION_LEVEL>=min&&!ROLE_PAGE_PROFILE[role].includes(pg))ROLE_PAGE_PROFILE[role].push(pg)})});
 ['superadmin','admin','doantruong','gvcn'].forEach(role=>{const a=ROLE_DEFS[role]?.permissions;if(Array.isArray(a)&&!a.includes('followup'))a.push('followup')});
 innovationInstallNav();innovationApplyBranding();
}
