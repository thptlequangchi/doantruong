*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}.app-shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:22px 16px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 24px}.brand-mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4d83ff,#5d4cff);display:grid;place-items:center;font-weight:900;box-shadow:0 8px 24px rgba(65,103,255,.35)}.brand strong{display:block;font-size:18px}.brand span{display:block;color:#aebbd1;font-size:12px;margin-top:2px}nav{display:grid;gap:6px}.nav-item{border:0;background:transparent;color:#bdc8dc;padding:11px 12px;border-radius:10px;text-align:left;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}.nav-item span{width:20px;text-align:center}.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.1);color:#fff}.sidebar-foot{margin-top:auto;padding:14px 8px;color:#93a3bd;font-size:12px;display:flex;align-items:center;gap:8px}.privacy-dot{width:8px;height:8px;border-radius:50%;background:#32d296;box-shadow:0 0 0 4px rgba(50,210,150,.13)}.main{min-width:0}.topbar{height:82px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:15}.title-wrap h1{font-size:22px;margin:0}.title-wrap p{font-size:12px;margin:3px 0 0;color:var(--muted)}.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}.week-chip{background:var(--bg);border:1px solid var(--line);padding:8px 10px;border-radius:10px;color:var(--muted);font-size:13px}.week-chip select{border:0;background:t /* Violation quick-entry upgrade */
.modal.modal-wide{width:min(1060px,100%)}
.modal-sub{font-size:12px;color:var(--muted);margin-top:3px}
.quick-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.65fr);gap:18px;align-items:start}
.quick-main{min-width:0}.picker-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.picker-toolbar .input{flex:1;min-width:220px}
.student-picker{margin-top:8px;max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:6px;gap:4px}

.student-pick-row input{accent-color:var(--primary)}.student-no{color:var(--muted);font-weight:700;text-align:right}.student-pick-name{font-weight:650}.student-pick-row[hidden]{display:none!important}
.rule-pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:2px}.rule-pick{display:grid;grid-template-columns:1fr 82px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:var(--panel)}
.rule-choice{display:flex;align-items:flex-start;gap:9px;cursor:pointer;min-width:0}.rule-choice input{margin-top:3px;accent-color:var(--primary)}.rule-choice span{min-width:0}.rule-choice b{display:block;font-size:12px;line-height:1.35}.rule-choice small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.rule-point-input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);padding:7px 6px;text-align:right;font-size:12px}
.quick-preview{position:sticky;top:0;border:1px solid var(--line);border-radius:14px;padding:14px;background:color-mix(in srgb,var(--bg) 78%,var(--panel));min-width:0}.quick-preview-title{font-size:13px;font-weight:850;margin-bottom:10px}.quick-preview-body{display:grid;gap:10px}.preview-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview-metrics>div{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px}.preview-metrics span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.35px}.preview-metrics strong{display:block;font-size:19px;margin-top:3px}.student-history{display:grid;gap:3px;border-top:1px dashed var(--line);padding-top:10px;font-size:12px}.student-history span{color:var(--muted)}.duplicate-warning{padding:9px 10px;border-radius:9px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 28%,var(--line));font-size:11px;font-weight:700}.quick-shortcuts{margin-top:12px;display:grid;gap:5px;font-size:11px;color:var(--muted);line-height:1.45}.quick-shortcuts b{color:var(--text)}
.mini-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}.mini-stat{padding:14px 16px}.mini-stat span{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase}.mini-stat strong{display:block;font-size:24px;margin:2px 0}.mini-stat small{color:var(--muted);font-size:11px}.violation-toolbar{padding:4px 0}.quick-hint{font-size:12px;color:var(--muted)}.toolbar-spacer{flex:1}.btn:disabled{opacity:.5;cursor:not-allowed}

/* Rule catalog from school regulation */
.rule-catalog-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 210px;gap:8px;margin:8px 0 10px}.rule-pick[hidden]{display:none!important}.rule-pick{align-items:start}.rule-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.rule-tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:9px;color:var(--muted);background:var(--bg);font-weight:750}.rule-tag.official{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,var(--line));background:color-mix(in srgb,var(--primary) 7%,var(--panel))}.rule-tag.classscope{color:var(--violet)}.rule-discipline{display:block!important;color:var(--danger)!important;font-weight:750;margin-top:5px!important;line-height:1.35}.rule-note{display:block!important;line-height:1.35}.rule-section-note{padding:9px 10px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:11px;margin-bottom:8px}.regulation-banner{margin-bottom:12px;padding:11px 13px;border-radius:11px;background:color-mix(in srgb,var(--primary) 7%,var(--panel));border:1px solid color-mix(in srgb,var(--primary) 20%,var(--line));font-size:12px;line-height:1.5}.official-handling{display:block;color:var(--danger);font-size:10px;margin-top:3px;max-width:260px;white-space:normal}.rule-setting-row{display:grid;grid-template-columns:54px 130px minmax(220px,1fr) 88px 78px 38px;gap:7px;align-items:center;margin-bottom:7px}.rule-setting-row .code{font-weight:850;color:var(--primary);font-size:11px}.rule-setting-row .category{font-size:11px;color:var(--muted)}.rules-scroll{max-height:650px;overflow:auto;padding-right:4px}.scope-alert{font-size:11px;color:var(--muted);margin-top:5px}.scope-alert strong{color:var(--violet)}
@media(max-width:900px){.rule-catalog-toolbar{grid-template-columns:1fr}.rule-setting-row{grid-template-columns:48px 1fr 82px 34px}.rule-setting-row .category{grid-column:2}.rule-setting-row .unit{display:none}}


/* v1.3.1 · Theo dõi học sinh & gợi ý hạnh kiểm */
.watch-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.watch-kpi{padding:15px 16px}.watch-kpi span{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.35px}.watch-kpi strong{display:block;font-size:27px;margin-top:3px}.watch-kpi small{color:var(--muted);font-size:11px}.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;border:1px solid var(--line);white-space:nowrap}.status-pill.normal{color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--panel));border-color:color-mix(in srgb,var(--good) 22%,var(--line))}.status-pill.watch{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel));border-color:color-mix(in srgb,var(--warn) 24%,var(--line))}.status-pill.alert{color:#c45c00;background:color-mix(in srgb,#ff8a00 10%,var(--panel));border-color:color-mix(in srgb,#ff8a00 28%,var(--line))}.status-pill.severe{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel));border-color:color-mix(in srgb,var(--danger) 28%,var(--line))}.conduct-pill{display:inline-grid;place-items:center;min-width:72px;border-radius:9px;padding:5px 8px;font-size:11px;font-weight:850;border:1px solid var(--line)}.conduct-tot{color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--panel))}.conduct-kha{color:#1976d2;background:color-mix(in srgb,#1976d2 8%,var(--panel))}.conduct-tb{color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel))}.conduct-yeu{color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}.watch-note{max-width:360px;white-space:normal;line-height:1.35}.watch-toolbar{display:grid;grid-template-columns:minmax(230px,1fr) 130px 150px 150px 180px;gap:9px;margin-bottom:14px}.watch-toolbar .input{min-width:0}.profile-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.profile-name{font-size:22px;font-weight:900}.profile-meta{color:var(--muted);font-size:12px;margin-top:3px}.profile-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0}.profile-metric{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--bg)}.profile-metric span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:750}.profile-metric strong{display:block;font-size:20px;margin-top:3px}.reason-list{display:grid;gap:7px;margin:10px 0}.reason-item{padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:12px;line-height:1.45}.timeline{display:grid;gap:8px;margin-top:10px}.timeline-item{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.timeline-item:last-child{border-bottom:0}.timeline-week{font-weight:800}.timeline-content b{display:block;margin-bottom:3px}.timeline-content small{color:var(--muted);line-height:1.4}.criteria-box{padding:11px 13px;border:1px dashed var(--line);border-radius:11px;background:color-mix(in srgb,var(--primary) 4%,var(--panel));font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:14px}.criteria-box b{color:var(--text)}
@media(max-width:1100px){.watch-toolbar{grid-template-columns:1fr 1fr 1fr}.watch-toolbar .search{grid-column:1/-1}.watch-kpis{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.watch-toolbar{grid-template-columns:1fr}.watch-toolbar .search{grid-column:auto}.watch-kpis,.profile-metrics{grid-template-columns:1fr 1fr}.profile-head{grid-template-columns:1fr}.timeline-item{grid-template-columns:75px 1fr}.timeline-item>.right{grid-column:2}.watch-note{max-width:240px}}

function gradeOf(cls){return String(state.classMeta?.[cls]?.grade||inferGrade(cls)||'')}

function parseLocalDate(iso){const p=String(iso||'').split('-').map(Number);return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function pad2(n){return String(n).padStart(2,'0')}
function shortDate(d){return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`}
function fullDate(d){return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`}
function getWeekCount(){return Math.max(1,Math.min(45,num(currentSchoolYear().weekCount)||37))}
function weekInfo(w){
 w=Math.max(1,Math.min(getWeekCount(),num(w)||1));const cfg=currentSchoolYear(),start=addDays(parseLocalDate(cfg.startDate),7*(w-1)),end=addDays(start,6);return {week:w,start,end,startMonth:start.getMonth()+1,endMonth:end.getMonth()+1,assignedMonth:end.getMonth()+1,assignedYear:end.getFullYear(),crossMonth:start.getMonth()!==end.getMonth()||start.getFullYear()!==end.getFullYear()};
}
function academicMonthEntries(){
 const out=[],seen=new Set();for(let w=1;w<=getWeekCount();w++){const i=weekInfo(w),key=`${i.assignedYear}-${pad2(i.assignedMonth)}`;let e=out.find(x=>x.key===key);if(!e){e={key,month:i.assignedMonth,year:i.assignedYear,weeks:[]};out.push(e);seen.add(key)}e.weeks.push(w)}return out;
}
function academicMonths(){return academicMonthEntries().map(x=>x.month)}
function monthEntry(m){return academicMonthEntries().find(x=>num(x.month)===num(m))}

function monthLabel(m){const e=monthEntry(m);return e?`Tháng ${e.month}/${e.year}`:`Tháng ${m}`}

function weekOptions(selected,dates=true){return Array.from({length:getWeekCount()},(_,i)=>{const w=i+1,inf=weekInfo(w);return `<option value="${w}" ${num(selected)===w?'selected':''}>${w}${dates?` · ${shortDate(inf.start)}–${shortDate(inf.end)}`:''}</option>`}).join('')}
function getScore(cls,w){const k=`${cls}|${w}`;return Object.assign({codo:0,sdb:0,bonus:0},state.scores[k]||{})}
function weekHasData(w){w=num(w);if(state.violations.some(v=>num(v.week)===w))return true;return classes.some(c=>{const x=state.scores[`${c}|${w}`];return !!x&&(num(x.codo)!==0||num(x.sdb)!==0||num(x.bonus)!==0)})}

function isWeekLocked(w){const st=weekStatus(w);return st==='closed'||st==='off'||isMonthClosed(weekInfo(w).assignedMonth)}

function setWeekStatus(w,status){if(!guardPermission('close_week'))return false;w=num(w);const before=weekStatus(w),m=weekInfo(w).assignedMonth;if(isMonthClosed(m)){toast('Tháng này đã chốt. Hãy mở lại tháng trước khi thay đổi tuần.');return false}state.weekStatuses=state.weekStatuses||{};if(status==='draft'&&!weekHasData(w))delete state.weekStatuses[String(w)];else state.weekStatuses[String(w)]=status;logAudit('week_status','week',`Tuần ${w}: ${weekStatusLabel(before)} → ${weekStatusLabel(status)}`,{week:w,before,status});save();return true}
function setScore(cls,w,key,val){if(!guardPermission('score',cls))return false;if(isWeekLocked(w)){toast('Tuần đã chốt/không học nên không thể sửa điểm.');return false}const k=`${cls}|${w}`,before=num((state.scores[k]||{})[key]);state.scores[k]=Object.assign({codo:0,sdb:0,bonus:0},state.scores[k]||{}, {[key]:num(val)});touchWeek(w);logAudit('score_update','weekly_score',`${cls} · Tuần ${w} · ${key}: ${before} → ${num(val)}`,{className:cls,week:w,key,before,after:num(val)});save();return true}
function deductions(cls,w){const s=getScore(cls,w),u=currentUser(),cid=classIdFor(cls);if(cloudRuntime?.onlineMode&&u.role==='teacher'&&!u.classIds.includes(cid)&&s.cloudDeductions!==undefined)return num(s.cloudDeductions);return state.violations.filter(v=>v.className===cls&&num(v.week)===num(w)).reduce((t,v)=>t+num(v.totalPoints),0)}

function monthCatalogItems(m){return (state.monthCatalog||[]).filter(x=>num(x.month)===0||num(x.month)===num(m))}
function monthAdjustments(cls,m){return (state.monthAdjustments||[]).filter(x=>x.className===cls&&num(x.month)===num(m))}
function monthAdjustmentSums(cls,m){let plus=0,minus=0;monthAdjustments(cls,m).forEach(x=>{const v=Math.abs(num(x.totalPoints));if(x.kind==='minus')minus+=v;else plus+=v});const legacy=num(state.bonuses?.[`${cls}|${m}`]);if(legacy>=0)plus+=legacy;else minus+=Math.abs(legacy);return {plus,minus,net:plus-minus,legacy}}

  const reasons=[];if(h1.count)reasons.push(`HKI: ${h1.count} lỗi · gợi ý ${h1.suggested}.`);if(h2.count)reasons.push(`HKII: ${h2.count} lỗi · gợi ý ${h2.suggested}.`);if(suggested==='Yếu')reasons.push('Mức năm lấy theo học kỳ có cảnh báo cao hơn, không cộng dồn số lỗi hai học kỳ để suy ra hạnh kiểm.');

 }

 return {allCount:all.length,allPoints:all.reduce((s,v)=>s+num(v.totalPoints),0),weekCount:inWeek.length,weekPoints:inWeek.reduce((s,v)=>s+num(v.totalPoints),0)};
}
function semesterFromWeek(w){return num(w)<=18?'hk1':'hk2'}
function conductFromCount(count){return count<=1?'Tốt':count<=4?'Khá':count<=6?'Trung bình':'Yếu'}
function conductLevel(name){return ({'Tốt':0,'Khá':1,'Trung bình':2,'Yếu':3})[name]??0}
function isPhoneRule(rule){return String(rule?.code||'')==='32'||normalizeText(rule?.name||rule?.content||'').includes('dien thoai thong minh')}
function isDowngradeRule(rule){return normalizeText(rule?.discipline||'').includes('ha 1 bac hanh kiem')}
function isDirectWeakRule(rule){

 return d.includes('hanh kiem yeu')||['30','34','37','44','36'].includes(code)||c.includes('gian lan trong kiem tra')||c.includes('gian lan trong thi cu');

function quickRiskAnalysis(data){
 const sem=semesterFromWeek(data.week),studentRules=(data.rules||[]).filter(r=>r.scope!=='class'),qty=Math.max(1,num(data.quantity)||1);
 const items=(data.students||[]).map(student=>{
  const current=studentConductSummary(data.className,student,sem);
  const addedCount=studentRules.reduce((sum)=>sum+qty,0),projectedCount=current.count+addedCount;
  const addPhone=studentRules.filter(isPhoneRule).reduce(sum=>sum+qty,0),projectedPhone=current.phoneCount+addPhone;
  const addDowngrade=studentRules.filter(isDowngradeRule).reduce(sum=>sum+qty,0),projectedDowngrade=current.downgradeSteps+addDowngrade;
  const selectedWeak=studentRules.filter(isDirectWeakRule);
  let projectedSuggested=conductFromCount(projectedCount);
  if(projectedPhone>=2||current.directWeak.length||selectedWeak.length||projectedCount>6)projectedSuggested='Yếu';
  else if(projectedDowngrade)projectedSuggested=lowerConduct(projectedSuggested,projectedDowngrade);
  const repeats=studentRules.map(rule=>{const before=current.records.filter(v=>(String(v.ruleCode||'')&&String(v.ruleCode||'')===String(rule.code||''))||(!v.ruleCode&&v.content===rule.name)).reduce((sum,v)=>sum+occurrences(v),0);return {rule,before,after:before+qty}}).filter(x=>x.after>1);
  const phoneCross=current.phoneCount<2&&projectedPhone>=2;
  const thresholdCross=[];
  if(current.count<2&&projectedCount>=2)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: chạm mốc gợi ý Khá.`);
  if(current.count<5&&projectedCount>=5)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: chạm mốc gợi ý Trung bình.`);
  if(current.count<=6&&projectedCount>6)thresholdCross.push(`Từ ${current.count} lên ${projectedCount} lỗi: vượt 6 lỗi trong ${semesterLabel(sem)}.`);
  if(phoneCross)thresholdCross.push(`Điện thoại từ ${current.phoneCount} lên ${projectedPhone} lần: đây là lần thứ ${projectedPhone}, kích hoạt cảnh báo hạnh kiểm Yếu.`);
  selectedWeak.forEach(r=>thresholdCross.push(`${r.code?`TT ${r.code} · `:''}${r.name}: thuộc nhóm cảnh báo hạnh kiểm Yếu/nghiêm trọng.`));
  const escalates=conductLevel(projectedSuggested)>conductLevel(current.suggested);
  let level='normal';
  if(repeats.length)level='watch';
  if(escalates||thresholdCross.length)level='alert';
  if(projectedSuggested==='Yếu'&&(escalates||phoneCross||selectedWeak.length)||phoneCross||selectedWeak.length)level='severe';
  return {student,sem,current,projectedCount,projectedPhone,projectedDowngrade,projectedSuggested,repeats,thresholdCross,phoneCross,selectedWeak,escalates,level,addedCount};
 });
 const severe=items.filter(x=>x.level==='severe').length,escalations=items.filter(x=>x.escalates).length,repeated=items.filter(x=>x.repeats.length).length;
 return {sem,items,severe,escalations,repeated,studentRules};
}

  const repeats=x.repeats.length?`<div class="risk-rule-repeat">${x.repeats.slice(0,3).map(r=>`<span>↻ ${r.rule.code?`TT ${esc(r.rule.code)} · `:''}${esc(r.rule.name)}: ${r.before} → <b>${r.after}</b> lần</span>`).join('')}${x.repeats.length>3?`<span>… và ${x.repeats.length-3} lỗi lặp khác</span>`:''}</div>`:'';

function reportCategoryKey(v){
 const code=String(v?.ruleCode||'');const t=normalizeText(v?.content||'');
 if(['5','6','47'].includes(code)||t.includes('vang hoc')||t.includes('vang hoat dong')) return 'Vắng học/HĐ';
 if(['8','9'].includes(code)||t.includes('cham hoc')||t.includes('cham tiet')||t.includes('di muon')) return 'Chậm học/tiết';
 if(code==='32'||t.includes('dien thoai')) return 'Điện thoại';
 if(['14','15','16'].includes(code)||t.includes('dong phuc')||t.includes('phu hieu')||t.includes('nhuom toc')||t.includes('khuyen tai')) return 'Trang phục';
 if(code==='30'||t.includes('danh nhau')||t.includes('gay go')) return 'Đánh nhau';
 return 'Khác';
}

function parseRosterText(text){

 lines.forEach((line,i)=>{let parts;if(line.includes('\t'))parts=line.split('\t');else if(line.includes(';'))parts=line.split(';');else parts=line.split(',');parts=parts.map(x=>x.trim().replace(/^"|"$/g,'')).filter((x,j)=>j<4||x);if(parts.length<2)return;let cls='',name='';const a=parts[0],b=parts[1];if(/^(10|11|12)[A-Za-z0-9._-]+$/i.test(a.replace(/\s+/g,''))){cls=a.replace(/\s+/g,'');name=b}else if(/^(10|11|12)[A-Za-z0-9._-]+$/i.test(b.replace(/\s+/g,''))){cls=b.replace(/\s+/g,'');name=a}else if(i===0&&normalizeText(line).includes('lop')&&normalizeText(line).includes('ho'))return;else return;if(!name||!cls)return;rows.push({className:cls,name:name.replace(/\s+/g,' ')})});

}
function reconcileRosterRows(rows){

}

 const remapObj=obj=>{Object.keys(obj||{}).forEach(k=>{if(k.startsWith(oldName+'|')){const nk=newName+k.slice(oldName.length);obj[nk]=obj[k];delete obj[k]}})};remapObj(state.scores);remapObj(state.bonuses);

function dataIntegrityReport(){
 const issues=[],profiles=allStudentProfiles(),ids=new Set(),profileIds=new Set(profiles.map(p=>p.id)),classIds=new Set();Object.entries(state.classMeta||{}).forEach(([name,m])=>{if(!m.id)issues.push({level:'error',code:'CLASS_NO_ID',text:`Lớp ${name} thiếu ID cố định`,entity:name});else if(classIds.has(m.id))issues.push({level:'error',code:'DUP_CLASS_ID',text:`Trùng mã lớp ${m.id}`,entity:name});else classIds.add(m.id)});
 profiles.forEach(p=>{if(ids.has(p.id))issues.push({level:'error',code:'DUP_STUDENT_ID',text:`Trùng mã học sinh ${p.id}`,entity:p.id});ids.add(p.id);if(!p.name||!p.className)issues.push({level:'error',code:'STUDENT_INCOMPLETE',text:`Hồ sơ ${p.id} thiếu tên hoặc lớp`,entity:p.id});if(!['active','transferred','left','graduated'].includes(p.status))issues.push({level:'warn',code:'STUDENT_STATUS',text:`${p.id} có trạng thái không hợp lệ`,entity:p.id})});
 (state.violations||[]).forEach(v=>{if(!v.id)issues.push({level:'error',code:'VIOLATION_NO_ID',text:'Có bản ghi vi phạm thiếu ID',entity:v.content||''});if(num(v.week)<1||num(v.week)>getWeekCount())issues.push({level:'warn',code:'VIOLATION_WEEK',text:`Vi phạm ${v.id||''} có tuần ngoài lịch: ${v.week}`,entity:v.id||''});if(!state.classMeta?.[v.className])issues.push({level:'warn',code:'VIOLATION_CLASS',text:`Vi phạm ${v.id||''} tham chiếu lớp chưa có: ${v.className}`,entity:v.id||''});if(studentViolationOnly(v)){if(!v.studentId)issues.push({level:'warn',code:'VIOLATION_NO_STUDENT_ID',text:`${v.className} · ${v.student}: chưa gắn studentId`,entity:v.id||''});else if(!profileIds.has(v.studentId))issues.push({level:'error',code:'ORPHAN_STUDENT_ID',text:`Vi phạm ${v.id||''} tham chiếu mã HS không tồn tại: ${v.studentId}`,entity:v.id||''});if(Math.abs(num(v.totalPoints)-num(v.quantity)*num(v.pointsPerUnit))>.001)issues.push({level:'warn',code:'VIOLATION_POINTS',text:`${v.id||''}: tổng điểm không khớp số lượng × mức điểm`,entity:v.id||''})}});
 Object.keys(state.scores||{}).forEach(k=>{const cls=k.split('|')[0];if(!state.classMeta?.[cls])issues.push({level:'warn',code:'SCORE_CLASS',text:`Điểm tuần đang tham chiếu lớp không có: ${cls}`,entity:k})});
 academicMonths().filter(m=>isMonthClosed(m)).forEach(m=>{const bad=monthWeeks(m).filter(w=>!['closed','off'].includes(weekStatus(w)));if(bad.length)issues.push({level:'error',code:'CLOSED_MONTH_WEEKS',text:`${monthLabel(m)} đã chốt nhưng còn tuần chưa chốt: ${bad.join(', ')}`,entity:monthKey(m)})});
 return issues;

 <div class="card card-pad"><h3 class="panel-title">Năm học & lịch tuần</h3><div class="school-year-config"><div class="field"><label>Năm học đang làm việc</label><select class="input" id="sySelect">${state.schoolYears.map(y=>`<option value="${esc(y.id)}" ${y.id===state.activeSchoolYear?'selected':''}>${esc(y.label)}</option>`).join('')}</select></div><div class="school-year-row"><div class="field"><label>Ngày bắt đầu Tuần 1</label><input class="input" id="syStart" type="date" value="${esc(cfg.startDate)}"></div><div class="field"><label>Số tuần năm học</label><input class="input" id="syWeeks" type="number" min="18" max="45" value="${getWeekCount()}"></div><div class="field"><label>HKI</label><input class="input" value="Tuần 1–18" disabled></div><button class="btn secondary danger-outline" id="deleteSchoolYear" ${state.schoolYears.length<=1?'disabled':''}>Xóa năm</button></div><div class="year-data-note"><b>Dữ liệu tách riêng theo năm học.</b> Vi phạm, hồ sơ học sinh có ID/trạng thái, danh sách lớp/GVCN, Cờ đỏ/SĐB, điểm cộng tuần, điểm cộng/trừ tháng và danh mục hoạt động tháng của ${esc(cfg.label)} được lưu độc lập. Đổi năm học sẽ không trộn dữ liệu.</div><hr style="border:0;border-top:1px solid var(--line);margin:4px 0"><b>Thêm năm học mới</b><div class="school-year-row"><div class="field"><label>Tên năm học</label><input class="input" id="newSyLabel" placeholder="VD: 2027-2028"></div><div class="field"><label>Tuần 1 bắt đầu</label><input class="input" id="newSyStart" type="date"></div><div class="field"><label>Số tuần</label><input class="input" id="newSyWeeks" type="number" min="18" max="45" value="37"></div><button class="btn" id="addSchoolYear">+ Thêm năm học</button></div></div></div></div>
 <div class="card card-pad" style="margin-top:16px"><div class="card-head" style="padding:0 0 8px"><h3>Lịch quy đổi tuần → tháng của ${esc(cfg.label)}</h3><span class="sub">Nếu tuần giao hai tháng, toàn bộ tuần tính cho tháng sau</span></div><div class="calendar-legend"><span class="pill">Tuần 1: ${fullDate(calendar[0]?.start||parseLocalDate(cfg.startDate))}</span><span class="pill">${getWeekCount()} tuần</span><span class="pill">${academicMonths().length} tháng có tuần</span><span>Ô vàng = tuần giao tháng</span></div><div class="week-calendar-grid">${calendar.map(i=>{const ws=weekStatus(i.week);return `<div class="week-calendar-item ${i.crossMonth?'month-shift':''} status-${weekStatusClass(ws)}"><b>Tuần ${i.week}</b><small>${shortDate(i.start)}–${fullDate(i.end)}</small><span class="assigned">→ ${monthLabel(i.assignedMonth)}</span><span class="week-state ${weekStatusClass(ws)}">${weekStatusLabel(ws)}</span></div>`}).join('')}</div></div>
 <div class="card card-pad" style="margin-top:16px"><h3 class="panel-title">Sao lưu dữ liệu</h3><div class="settings-data-actions"><button class="btn" id="exportData">Xuất sao lưu JSON</button><label class="btn secondary file-btn">Phục hồi JSON<input id="importData" type="file" accept=".json,application/json"></label><button class="btn danger" id="resetData">Xóa dữ liệu năm hiện tại</button></div><div class="alert" style="margin-top:14px">File sao lưu chứa toàn bộ các năm học đã tạo. Bản v1.5.1 dùng localStorage làm bộ nhớ đệm. Khi bật chế độ Online và đăng nhập Firebase, các thay đổi nghiệp vụ được đồng bộ lên Firestore theo quyền tài khoản.</div></div>`;
 const drawRules=()=>{$('#rules').innerHTML=state.rules.map((r,i)=>`<div class="rule-setting-row"><span class="code">${r.official?'TT '+esc(r.code):'TC'}</span><span class="category">${esc(r.category||'Tùy chỉnh')}</span><input class="input" value="${esc(r.name)}" data-rule-name="${i}" ${r.official?'title="Nội dung theo dự thảo quy chế"':''}><input class="input right" type="number" step="0.5" value="${num(r.points)}" data-rule-points="${i}" title="Điểm trừ"><span class="unit muted">/${esc(r.unit||'lần')}</span><button class="icon-btn" data-rule-del="${i}" ${r.official?'disabled title="Không xóa mục quy chế"':''}>×</button></div>`).join('');$$('[data-rule-name]').forEach(x=>x.onchange=()=>{state.rules[num(x.dataset.ruleName)].name=x.value.trim()||'Vi phạm';save()});$$('[data-rule-points]').forEach(x=>x.onchange=()=>{state.rules[num(x.dataset.rulePoints)].points=Math.max(0,num(x.value));save()});$$('[data-rule-del]').forEach(x=>x.onclick=()=>{const i=num(x.dataset.ruleDel);if(!state.rules[i]?.official&&state.rules.length>1){state.rules.splice(i,1);save();drawRules()}})};drawRules();
 $('#addRule').onclick=()=>{state.rules.push({code:'TC',category:'Tùy chỉnh',name:'Nội dung mới',points:1,unit:'lần',scope:'student',discipline:'',note:'',official:false});save();drawRules()};$('#resetRules').onclick=()=>{if(confirm('Khôi phục toàn bộ danh mục và mức điểm theo dự thảo quy chế? Các lỗi tùy chỉnh sẽ được giữ lại.')){const custom=state.rules.filter(r=>!r.official);state.rules=[...clone(DEFAULT_RULES),...custom];save();drawRules();toast('Đã khôi phục danh mục quy chế')}};
 $('#sySelect').onchange=e=>switchSchoolYear(e.target.value);
 $('#syStart').onchange=e=>{const v=e.target.value;if(!v)return;cfg.startDate=v;save();const ms=academicMonths();selectedMonth=ms[0]||9;fillWeeks();settings();toast('Đã cập nhật ngày bắt đầu Tuần 1')};
 $('#syWeeks').onchange=e=>{cfg.weekCount=Math.max(18,Math.min(45,num(e.target.value)||37));if(week>cfg.weekCount)week=cfg.weekCount;save();const ms=academicMonths();if(!ms.includes(selectedMonth))selectedMonth=ms[0]||9;fillWeeks();settings();toast('Đã cập nhật số tuần năm học')};
 $('#addSchoolYear').onclick=()=>{if(!guardPermission('settings'))return;const label=$('#newSyLabel').value.trim(),start=$('#newSyStart').value,w=Math.max(18,Math.min(45,num($('#newSyWeeks').value)||37));if(!label||!start)return toast('Nhập tên năm học và ngày bắt đầu Tuần 1');const id=normalizeYearId(label);if(state.schoolYears.some(y=>y.id===id))return toast('Năm học này đã tồn tại');state.schoolYears.push({id,label:label.replace(/(20\d{2})-(20\d{2})/,'$1–$2'),startDate:start,weekCount:w});syncActiveYearStore();state.yearStore[id]=blankYearData(state.monthCatalog,state.roster||window.SEED_ROSTER,state.classMeta,state.studentMeta,id);save();fillSchoolYears();toast('Đã thêm năm học mới (đã sao chép danh sách HS hiện tại)') ;settings()};
 $('#deleteSchoolYear').onclick=async()=>{if(!guardPermission('settings'))return;if(state.schoolYears.length<=1)return;const id=state.activeSchoolYear,label=currentSchoolYear().label;if(!confirm(`Xóa năm học ${label} và toàn bộ dữ liệu riêng của năm này${cloudRuntime.onlineMode?' trên cả Firestore':''}?`))return;try{if(cloudRuntime.onlineMode)await cloudDeleteSchoolYear(id);syncActiveYearStore();state.schoolYears=state.schoolYears.filter(y=>y.id!==id);delete state.yearStore[id];const next=state.schoolYears[0].id;if(cloudRuntime.onlineMode)await cloudLoadYear(next,{activate:true});else loadActiveYearData(next);week=1;selectedMonth=academicMonths()[0]||9;save();fillSchoolYears();fillWeeks();toast(`Đã xóa ${label}`);settings()}catch(e){cloudFail(e,'Không xóa được năm học')}};
 $('#exportData').onclick=()=>{save();const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ne-nep-${normalizeYearId(currentSchoolYear().label)}-all-years-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 $('#importData').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!x.version)throw new Error('Sai định dạng');state=migrateState(x);state.classMeta=normalizeClassMeta(state.classMeta,state.roster||DEFAULT_ROSTER,state.activeSchoolYear);state.studentMeta=normalizeStudentMeta(state.roster||DEFAULT_ROSTER,state.studentMeta,state.activeSchoolYear);state.roster=rosterFromStudentMeta(state.studentMeta,state.classMeta,state.roster||DEFAULT_ROSTER);window.SEED_ROSTER=state.roster;refreshClasses();week=1;selectedMonth=academicMonths()[0]||9;save();setTheme();fillSchoolYears();fillWeeks();toast('Đã phục hồi dữ liệu');settings()}catch(err){alert('Không đọc được file sao lưu.')}};rd.readAsText(f)};
 $('#resetData').onclick=()=>{if(!guardPermission('settings'))return;if(confirm(`Xóa toàn bộ vi phạm, điểm tuần và điểm tháng của ${currentSchoolYear().label}? Các năm học khác không bị ảnh hưởng.`)){state.violations=[];state.scores={};state.bonuses={};state.monthAdjustments=[];state.weekStatuses={};state.monthStatuses={};state.yearAdjustments={};state.lastViolationContext=null;logAudit('year_reset','system','Xóa dữ liệu nghiệp vụ năm hiện tại');save();toast('Đã xóa dữ liệu năm học hiện tại');settings()}};
}
function render(){fillUsers();fillSchoolYears();fillWeeks();applyNavPermissions();const map={dashboard,violations,scores,weekly,year,students,classes:classesPage,studentwatch,homeroomreport,accounts:accountsPage,audit:auditPage,online:onlinePage,settings};(map[page]||dashboard)()}
setTheme();fillSchoolYears();fillWeeks();bindNav();render();updateCloudChrome();if(window.PUBLIC_ONLINE_BUILD)showAuthGate('login','Đang kiểm tra phiên đăng nhập...');initFirebaseOnline();
})();

</script>
</body>
</html>
